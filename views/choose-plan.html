<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resume Boy - Choose Plan</title>
    <meta name="description" content="Resume Boy is an AI powered resume generator for AI powered personalized job matching and personalize resume generator workflows.">
    <meta name="keywords" content="AI powered resume generator, AI powered personalized job, personalize resume generator, ATS resume generator">
    <link rel="icon" type="image/avif" href="/favicon.png.avif">
    <link rel="apple-touch-icon" href="/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="choose-plan-page">
    <div class="dashboard-grid-bg" aria-hidden="true"></div>

    <main class="choose-plan-shell" aria-labelledby="choose-plan-title">
      <section class="choose-plan-copy">
        <p class="flow-eyebrow">One last step</p>
        <h1 id="choose-plan-title">Choose your Resume Boy plan</h1>
        <p>Start free or unlock monthly generations. You can upgrade later from Profile.</p>
      </section>

      <section id="choose-plan-grid" class="choose-plan-grid" aria-live="polite">
        <div class="choose-plan-loading">Loading plans...</div>
      </section>

      <p id="choose-plan-state" class="choose-plan-state" aria-live="polite"></p>
    </main>

    <template id="choose-plan-card-template">
      <article class="choose-plan-card">
        <div class="choose-plan-card-top">
          <span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>
          <small></small>
        </div>
        <h2></h2>
        <div class="choose-plan-price"></div>
        <ul></ul>
        <button class="button button-primary" type="button"></button>
      </article>
    </template>

    <script src="/choose-plan.js"></script>
  </body>
</html>
